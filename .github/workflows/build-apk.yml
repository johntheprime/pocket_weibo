# Release workflow: build and publish a signed APK.
#
# Triggers:
#   - push a version tag (e.g. `git tag v3.60.0 && git push origin v3.60.0`) → official release
#   - manual run from Actions → Release → Run workflow → optional release / pre-release
#
# Why this matters: GitHub-hosted `assembleDebug` APKs are signed with a fresh debug key every run,
# so Android treats each download as a different app (no upgrades, data lost on reinstall).
# For release builds, CI writes `secrets/keystore.properties` + `secrets/ci-release.keystore` using
# repo secrets so every published APK shares the same signature and upgrades in place.
#
# If the secret values are missing, the workflow falls back to `assembleDebug` so the build still
# proves the project compiles while keeping the release-signing path intact for actual publishing.
#
# Pull requests and pushes to `main` are validated by `ci.yml`, not by this workflow.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a new GitHub release (versioned tag + APK + source tarball)"
        type: boolean
        default: true
      prerelease:
        description: "Mark release as pre-release (leave unchecked for an official / latest release)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_COMPILE_API: "34"
      ANDROID_SDK_BUILD_TOOLS: "34.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version from Gradle
        id: appver
        run: |
          set -euo pipefail
          VN=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VC=$(sed -n 's/.*versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VN" ] || [ -z "$VC" ]; then
            echo "Failed to parse versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "App version: $VN (code $VC)"

      # Tag runs publish the tag that triggered them. Manual runs create a unique tag.
      - name: Resolve release tag
        id: reltag
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="apk-v${{ steps.appver.outputs.version_name }}-${{ steps.appver.outputs.version_code }}-r${{ github.run_number }}-${{ github.run_attempt }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      # Keep the tag and versionName in sync so releases are predictable.
      - name: Verify tag matches versionName
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VN="${{ steps.appver.outputs.version_name }}"
          if [ "$TAG" != "v${VN}" ]; then
            echo "::error::Tag '$TAG' does not match versionName '$VN'; expected tag 'v${VN}'."
            exit 1
          fi

      # NOTE: `secrets.*` is not available in `if:` expressions. Detect the secrets inside
      # the step and export a regular step output that later steps can branch on.
      - name: Configure release signing (optional)
        id: signing
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KS_BASE64:-}" ] || [ -z "${KS_PASSWORD:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; will build a debug APK."
            exit 0
          fi
          KEY_PASS="${KEY_PASSWORD:-$KS_PASSWORD}"
          mkdir -p "$GITHUB_WORKSPACE/secrets"
          printf '%s' "$KS_BASE64" | base64 -d > "$GITHUB_WORKSPACE/secrets/ci-release.keystore"
          chmod 600 "$GITHUB_WORKSPACE/secrets/ci-release.keystore"
          umask 077
          {
            echo "storeFile=ci-release.keystore"
            echo "storePassword=${KS_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-pocketweibo}"
            echo "keyPassword=${KEY_PASS}"
          } > "$GITHUB_WORKSPACE/secrets/keystore.properties"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Release signing secrets detected; will build a signed release APK."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3 downloads the moving `_latest` cmdline-tools URL, which now returns 404
      # (android-actions/setup-android#513). v4 pins a versioned archive that still exists
      # and puts sdkmanager on PATH, so the install step below works.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"

      - name: Install SDK packages (match app compileSdk)
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-${ANDROID_SDK_COMPILE_API}" "build-tools;${ANDROID_SDK_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew test assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (no release signing secrets)
        if: ${{ steps.signing.outputs.enabled != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version and run id
        id: apkname
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          VN="${{ steps.appver.outputs.version_name }}"
          VC="${{ steps.appver.outputs.version_code }}"
          RUN="${{ github.run_number }}-${{ github.run_attempt }}"
          release_apks=(app/build/outputs/apk/release/*.apk)
          debug_apks=(app/build/outputs/apk/debug/*.apk)
          if ((${#release_apks[@]})); then
            SRC="${release_apks[0]}"
            DEST="pocket-weibo-release-v${VN}-${VC}-r${RUN}.apk"
            KIND=release
          elif ((${#debug_apks[@]})); then
            SRC="${debug_apks[0]}"
            DEST="pocket-weibo-debug-v${VN}-${VC}-r${RUN}.apk"
            KIND=debug
          else
            echo "No APK was produced."
            exit 1
          fi
          mv "$SRC" "$DEST"
          echo "artifact_kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${DEST}" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - name: Pack source at this commit (tar.gz)
        run: |
          set -euo pipefail
          VN="${{ steps.appver.outputs.version_name }}"
          VC="${{ steps.appver.outputs.version_code }}"
          SRC="pocket-weibo-v${VN}-${VC}-source-${{ github.sha }}.tar.gz"
          git archive --format=tar.gz --prefix="pocket-weibo-${{ github.sha }}/" -o "$SRC" HEAD
          ls -la "$SRC"

      - name: Upload APK and source artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-weibo-${{ steps.apkname.outputs.artifact_kind }}-${{ steps.appver.outputs.version_name }}-${{ steps.appver.outputs.version_code }}-${{ github.run_number }}-${{ github.sha }}
          path: |
            pocket-weibo-*.apk
            pocket-weibo-v*-source-*.tar.gz
          if-no-files-found: error

      # Tag pushes always publish. Manual runs publish only when requested.
      - name: Publish GitHub release (release signing only)
        if: ${{ steps.signing.outputs.enabled == 'true' && (github.event_name == 'push' || inputs.publish_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: PocketWeibo v${{ steps.appver.outputs.version_name }} (${{ steps.appver.outputs.version_code }})
          body: |
            **Signed release** APK built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            - **APK:** `${{ steps.apkname.outputs.artifact_name }}`
            - **versionName:** ${{ steps.appver.outputs.version_name }}
            - **versionCode:** ${{ steps.appver.outputs.version_code }}
          files: |
            pocket-weibo-release-v*.apk
            pocket-weibo-v*-source-*.tar.gz
          # Tag runs and manual runs publish an official release unless "prerelease" is checked.
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ !(inputs.prerelease == true) }}
          generate_release_notes: true
